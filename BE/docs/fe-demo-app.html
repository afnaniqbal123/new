<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSTC1 Demo App</title>
<style>

:root {
  --bg: #ffffff;
  --bg-elevated: #f7f7f9;
  --bg-inset: #eef0f3;
  --border: #e1e3e8;
  --text: #16171b;
  --text-muted: #6b6e78;
  --accent: #3d5afe;
  --accent-text: #ffffff;
  --success: #1a7f37;
  --warning: #9a6700;
  --error: #cf222e;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --get: #0969da; --post: #1a7f37; --put: #9a6700; --patch: #8250df; --delete: #cf222e;
  --radius: 10px;
  --radius-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101013; --bg-elevated: #17171b; --bg-inset: #1e1e24; --border: #2b2b32;
    --text: #eceef1; --text-muted: #94969f; --accent: #7c93ff; --accent-text: #0c0c10;
    --success: #56d364; --warning: #e3b341; --error: #ff7b72;
    --get: #6cb6ff; --post: #56d364; --put: #e3b341; --patch: #c297ff; --delete: #ff7b72;
  }
}
:root[data-theme="dark"] {
  --bg: #101013; --bg-elevated: #17171b; --bg-inset: #1e1e24; --border: #2b2b32;
  --text: #eceef1; --text-muted: #94969f; --accent: #7c93ff; --accent-text: #0c0c10;
  --success: #56d364; --warning: #e3b341; --error: #ff7b72;
  --get: #6cb6ff; --post: #56d364; --put: #e3b341; --patch: #c297ff; --delete: #ff7b72;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14.5px; display: flex; flex-direction: column; overflow: hidden; }
button { font-family: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); }
h1, h2, h3 { font-weight: 700; }
.muted { color: var(--text-muted); }

/* ---- top bar ---- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elevated); flex: 0 0 auto; z-index: 20; position: relative; }
.brand { font-weight: 800; font-size: 16px; }
.conn-toggle { background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-muted); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
#conn-bar[hidden], .modal-overlay[hidden] { display: none !important; }
#conn-bar { display: flex; align-items: center; gap: 8px; position: absolute; top: 46px; left: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
#conn-bar input { background: var(--bg-inset); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 7px 10px; font-family: var(--mono); font-size: 12.5px; width: 230px; }
.tag { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: .03em; white-space: nowrap; }
.tag-mock { border: 1px dashed var(--text-muted); color: var(--text-muted); }
.tag-live { background: var(--accent); color: var(--accent-text); }
.spacer { flex: 1; }
.bell-wrap { position: relative; }
.bell-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text); position: relative; padding: 6px; }
.bell-badge { position: absolute; top: 0; right: 0; background: var(--error); color: #fff; font-size: 10px; border-radius: 10px; min-width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.bell-panel { position: absolute; right: 0; top: 38px; width: 320px; max-height: 400px; overflow-y: auto; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 28px rgba(0,0,0,.2); padding: 6px; }
.notif-item { padding: 10px; border-radius: var(--radius-sm); font-size: 13px; }
.notif-item:hover { background: var(--bg-inset); }
.notif-item .title { font-weight: 600; }
.notif-item.unread { border-left: 3px solid var(--accent); }
.session-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.session-chip button { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; color: var(--text-muted); cursor: pointer; font-size: 12px; }

/* ---- shell ---- */
.shell { flex: 1 1 auto; display: flex; min-height: 0; }
#app-nav { width: 210px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--bg-elevated); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav-item { text-align: left; background: none; border: none; color: var(--text); padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; font-weight: 500; }
.nav-item:hover:not(:disabled) { background: var(--bg-inset); }
.nav-item.active { background: var(--accent); color: var(--accent-text); }
.nav-item:disabled { color: var(--text-muted); opacity: .5; cursor: not-allowed; }
#screen-root { flex: 1 1 auto; overflow-y: auto; min-width: 0; }
.screen { max-width: 980px; margin: 0 auto; padding: 32px 28px 90px; }
.screen.wide { max-width: 1180px; }

/* ---- cards / forms ---- */
.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; }
.auth-card { max-width: 400px; margin: 60px auto; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
.auth-card h1 { margin-top: 0; font-size: 22px; }
label { display: block; font-size: 12.5px; color: var(--text-muted); margin: 14px 0 5px; font-weight: 600; }
label:first-of-type { margin-top: 0; }
input, textarea, select { width: 100%; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 13.5px; font-family: var(--sans); }
input.mono, textarea.mono { font-family: var(--mono); font-size: 12.5px; }
textarea { min-height: 120px; resize: vertical; }
.btn-primary { background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius-sm); padding: 10px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-top: 16px; }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-primary:hover:not(:disabled) { opacity: .92; }
.btn-ghost { background: var(--bg-inset); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; cursor: pointer; }
.btn-danger { background: none; color: var(--error); border: 1px solid var(--error); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; cursor: pointer; }
.form-row-inline { display: flex; gap: 10px; align-items: end; }
.form-row-inline > div { flex: 1; }

.banner { border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.banner-error { background: color-mix(in srgb, var(--error) 12%, transparent); border: 1px solid var(--error); color: var(--error); }
.banner-success { background: color-mix(in srgb, var(--success) 12%, transparent); border: 1px solid var(--success); color: var(--success); }

.stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
.stat-tile { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; min-width: 110px; }
.stat-tile .num { font-size: 22px; font-weight: 800; }
.stat-tile .label { color: var(--text-muted); font-size: 11.5px; }

/* ---- avatar ---- */
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.avatar.small { width: 22px; height: 22px; font-size: 10px; }

/* ---- chat ---- */
.chat-screen { display: flex; gap: 0; height: calc(100vh - 140px); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.room-list { width: 260px; flex: 0 0 auto; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg-elevated); }
.room-item { display: flex; gap: 8px; align-items: center; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; }
.room-item:hover, .room-item.active { background: var(--bg-inset); }
.room-item .meta { flex: 1; min-width: 0; }
.room-item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-item .preview { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-thread-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-inset); }
.bubble-row { display: flex; gap: 8px; max-width: 78%; align-items: flex-end; }
.bubble-row.mine { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
.bubble-row.mine .bubble { background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
.bubble-row.theirs .bubble { background: var(--bg-elevated); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-thread-pane form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--bg-elevated); }
.chat-thread-pane form input { flex: 1; }
.chat-thread-pane form button { margin-top: 0; }

/* ---- FAB + modal ---- */
.fab { position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-text); border: none; font-size: 22px; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,.25); z-index: 40; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); width: 420px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column; position: relative; }
.modal-close { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
.modal .chat-thread { max-height: 340px; border-radius: 0; }
.modal-header { padding: 14px 16px 0; font-weight: 700; }

/* ---- table ---- */
.table-toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
.table-toolbar input { max-width: 260px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.data-table { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data-table th, table.data-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-table th { background: var(--bg-inset); color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
table.data-table tr:hover td { background: var(--bg-inset); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
.badge-owner, .badge-admin { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.badge-member { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.badge-viewer { background: var(--bg-inset); color: var(--text-muted); }
.badge-active { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.badge-pending, .badge-unapproved { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
.badge-inactive { background: color-mix(in srgb, var(--error) 15%, transparent); color: var(--error); }

/* ---- billing ---- */
.card-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.card-row:last-child { border-bottom: none; }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 12px; margin-top: 10px; }
.plan-tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.plan-tile .price { font-size: 20px; font-weight: 800; margin: 6px 0; }

/* ---- media ---- */
.dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px; text-align: center; color: var(--text-muted); }
.thumb { width: 90px; height: 90px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); vertical-align: middle; margin-right: 10px; }
.upload-success { color: var(--success); display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.loading { color: var(--text-muted); font-size: 13px; }

/* ---- explorer ---- */
.explorer { display: flex; height: calc(100vh - 62px); }
.explorer-nav { width: 280px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--bg-elevated); display: flex; flex-direction: column; }
#explorer-search-wrap { padding: 10px; border-bottom: 1px solid var(--border); }
#explorer-search { width: 100%; }
#explorer-nav-scroll { overflow-y: auto; flex: 1; padding-bottom: 20px; }
.nav-group-title { width: 100%; text-align: left; background: none; border: none; color: var(--text-muted); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 10px 14px 4px; cursor: pointer; }
.nav-group ul { list-style: none; margin: 0; padding: 0; }
.expl-link { display: flex; align-items: center; gap: 8px; padding: 6px 14px; text-decoration: none; color: var(--text); font-size: 12.5px; border-left: 2px solid transparent; }
.expl-link:hover { background: var(--bg-inset); }
.expl-link.active { background: var(--bg-inset); border-left-color: var(--accent); color: var(--accent); }
.method-badge { display: inline-block; min-width: 40px; text-align: center; font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 2px 4px; border-radius: 4px; color: #fff; flex: 0 0 auto; }
.method-get { background: var(--get); } .method-post { background: var(--post); } .method-put { background: var(--put); } .method-patch { background: var(--patch); } .method-delete { background: var(--delete); }
.explorer-detail { flex: 1; overflow-y: auto; padding: 24px 28px 90px; min-width: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 14px 0 16px; }
.tabs button { background: none; border: none; color: var(--text-muted); padding: 8px 13px; font-size: 12.5px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
.tab-panel[hidden] { display: none; }
.info-table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 12.5px; }
.info-table th, .info-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
.info-table th { color: var(--text-muted); font-weight: 600; width: 28%; }
.notes-box { background: var(--bg-inset); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }
.json-view { background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); }
.status-badge { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
.status-2xx { color: var(--success); background: color-mix(in srgb, var(--success) 15%, transparent); }
.status-4xx { color: var(--warning); background: color-mix(in srgb, var(--warning) 15%, transparent); }
.status-5xx { color: var(--error); background: color-mix(in srgb, var(--error) 15%, transparent); }
.result-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.editor-error { color: var(--error); font-size: 11.5px; margin-top: 4px; }
.empty-state { color: var(--text-muted); font-size: 13px; padding: 10px 0; }
.error-block { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
.icon-btn { background: var(--bg-inset); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 7px 10px; cursor: pointer; font-size: 14px; }

/* ---- workspace grid (fallback for modules without a bespoke screen) ---- */
.workspace-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 14px; margin-top: 14px; }
.workspace-grid .card form { margin-top: 10px; }
.workspace-result { margin-top: 10px; }

/* ---- step diagram ---- */
.step-diagram { display: flex; align-items: center; margin: 6px 0 20px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; }
.step-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.step.active .step-dot { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.step.done .step-dot { background: var(--success); color: #fff; border-color: var(--success); }
.step-label { font-size: 11px; color: var(--text-muted); text-align: center; }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 -4px 18px; min-width: 20px; }

/* ---- provider tabs / billing sub-sections ---- */
.provider-tabs { display: flex; gap: 6px; margin: 6px 0 18px; }
.provider-tabs button { background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-muted); border-radius: 20px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
.provider-tabs button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.billing-section-title { display: flex; align-items: center; gap: 8px; margin: 26px 0 4px; }
.billing-section-title h3 { margin: 0; }

/* ---- mock checkout ---- */
.mock-checkout { text-align: center; padding: 6px; }
.mock-checkout h3 { margin: 10px 0 4px; }
.mock-checkout input { text-align: center; margin: 14px 0; }
.mock-checkout .btn-primary { width: 100%; }

/* ---- entity picker ---- */
.picker-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.picker-row:hover { background: var(--bg-inset); }
#picker-results { max-height: 300px; overflow-y: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
.picker-pagination { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 12.5px; color: var(--text-muted); }

/* ---- avatar large / profile ---- */
.avatar-lg { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--bg-inset); border: 1px solid var(--border); display: block; }
.avatar-field { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

/* ---- chat room extras ---- */
.room-item .room-actions { display: flex; align-items: center; gap: 6px; }
.room-item .unread-dot { background: var(--accent); color: var(--accent-text); font-size: 10px; font-weight: 700; border-radius: 10px; min-width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
.room-item .room-delete { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 2px 4px; opacity: 0; }
.room-item:hover .room-delete { opacity: 1; }
.new-chat-btn { margin: 10px; width: calc(100% - 20px); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

@media (max-width: 820px) {
  #app-nav { position: fixed; z-index: 15; top: 53px; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .15s; box-shadow: 4px 0 16px rgba(0,0,0,.2); }
  #app-nav.open { transform: translateX(0); }
  .screen { padding: 18px; }
  .explorer { flex-direction: column; height: auto; }
  .explorer-nav { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
  .chat-screen { flex-direction: column; height: auto; }
  .room-list { width: 100%; max-height: 160px; }
}

</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="sidebar-toggle" title="Toggle navigation" aria-label="Toggle navigation">☰</button>
  <div class="brand">BSTC1</div>
  <button class="conn-toggle" onclick="toggleConnBar()">Connection <span id="conn-mode">MOCK MODE</span> ▾</button>
  <div id="conn-bar" hidden>
    <input id="base-url" placeholder="Base URL, e.g. http://localhost:8080" oninput="STATE.baseUrl=this.value; updateConnMode();">
    <input id="auth-token" type="password" placeholder="Bearer token (auto-filled on login)" oninput="STATE.authToken=this.value">
    <span id="conn-mode-2" class="muted" style="font-size:11px"></span>
  </div>
  <div class="spacer"></div>
  <div class="bell-wrap">
    <button class="bell-btn" onclick="toggleBell()" aria-label="Notifications">🔔<span class="bell-badge" id="bell-badge" hidden>0</span></button>
    <div class="bell-panel" id="bell-panel" hidden></div>
  </div>
  <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">🌓</button>
  <div id="session-chip"></div>
</div>

<div class="shell">
  <nav id="app-nav"></nav>
  <main id="screen-root"></main>
</div>

<button class="fab" onclick="openAssistant()" title="Ask the assistant" aria-label="Ask the assistant">💬</button>
<div class="modal-overlay" id="assistant-modal" hidden>
  <div class="modal">
    <button class="modal-close" onclick="closeAssistant()">✕</button>
    <div class="modal-header">Platform Assistant

function initials(nameOrUser) {

// ================= callApi engine (JSON + multipart, live + mock) =================
async function callApi(feature, { pathParams = {}, queryParams = {}, body, isMultipart = false } = {}) {
  let path = feature.path;
  Object.entries(pathParams).forEach(([k, v]) => { path = path.replace(`{${k}}`, encodeURIComponent(v)); });
  const qsEntries = Object.entries(queryParams).filter(([,v]) => v !== undefined && v !== null && v !== '');
  const qs = new URLSearchParams(qsEntries).toString();
  if (qs) path += (path.includes('?') ? '&' : '?') + qs;

  updateConnMode();
  if (!STATE.baseUrl) return mockResultFor(feature);

  const url = STATE.baseUrl.replace(/\/$/, '') + path;
  const headers = {};
  if (!isMultipart) headers['Content-Type'] = 'application/json';
  if (STATE.authToken) headers['Authorization'] = 'Bearer ' + STATE.authToken;

  try {
    const res = await fetch(url, {
      method: feature.method,
      headers,
      body: ['GET','HEAD'].includes(feature.method) || body === undefined ? undefined : (isMultipart ? body : JSON.stringify(body)),
    });
    let payload;
    const ct = res.headers.get('content-type') || '';
    try { payload = ct.includes('application/json') ? await res.json() : await res.text(); }
    catch { payload = await res.text().catch(()=>''); }
    return { mock: false, error: !res.ok, status: res.status, body: payload };
  } catch (e) {
    return mockResultFor(feature, e.message);
  }
}
function mockResultFor(feature, reason) {
  const ex = feature.response_success;
  return { mock: true, error: false, status: ex ? ex.status : 200, body: ex ? ex.body : {}, mockReason: reason || 'no base URL set' };
}

// ================= generic form fields (Module Workspace + billing sub-forms) =================
function prettyLabel(key) { return key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()); }
function inputTypeFor(key, val) {
  const k = key.toLowerCase();
  if (k.includes('password')) return 'password';
  if (k.includes('email')) return 'email';
  if (typeof val === 'number') return 'number';
  return 'text';
}
function renderGenericFields(prefix, obj) {
  if (obj === null || obj === undefined) return '';
  return Object.entries(obj).map(([k, v]) => {
    const isComplex = v !== null && typeof v === 'object';
    if (isComplex) {
      return `<label for="${prefix}-${k}">${escapeHtml(prettyLabel(k))} (JSON)</label>
        <textarea id="${prefix}-${k}" class="mono" data-key="${k}" data-kind="json">${escapeHtml(JSON.stringify(v, null, 2))}</textarea>`;
    }
    return `<label for="${prefix}-${k}">${escapeHtml(prettyLabel(k))}</label>
      <input id="${prefix}-${k}" data-key="${k}" data-kind="${typeof v}" type="${inputTypeFor(k, v)}" value="${escapeHtml(v)}">`;
  }).join('');
}
function collectGenericFields(prefix, obj) {
  if (!obj) return undefined;
  const out = {};
  Object.keys(obj).forEach(k => {
    const el = document.getElementById(`${prefix}-${k}`);
    if (!el) return;
    const kind = el.dataset.kind;
    if (kind === 'json') { try { out[k] = JSON.parse(el.value); } catch { out[k] = el.value; } }
    else if (kind === 'number') { out[k] = el.value === '' ? undefined : Number(el.value); }
    else { out[k] = el.value; }
  });
  return out;
}

let pickerState = null;
function openEntityPicker(config) {
  pickerState = { ...config, page: 1, search: '' };
  showModal(`
    <h3>${escapeHtml(config.title)}</h3>
    <input id="picker-search" placeholder="Search…" oninput="pickerSearch(this.value)">
    <div id="picker-results"><div class="loading">Loading…</div></div>
    <div class="picker-pagination">
      <button class="btn-ghost" onclick="pickerPage(-1)">‹ Prev</button>
      <span id="picker-page-label"></span>
      <button class="btn-ghost" onclick="pickerPage(1)">Next ›</button>
    </div>`);
  loadPickerResults();
}
function closeEntityPicker() { if (pickerState) closeModal(); pickerState = null; }
let pickerDebounce;
function pickerSearch(q) {
  clearTimeout(pickerDebounce);
  pickerDebounce = setTimeout(() => { pickerState.search = q; pickerState.page = 1; loadPickerResults(); }, 250);
}
function pickerPage(delta) { pickerState.page = Math.max(1, pickerState.page + delta); loadPickerResults(); }
async function loadPickerResults() {
  const { listFeatureId, searchParam, pageParam, limitParam, renderItem, mockItems, excludeSelf } = pickerState;
  const feature = findFeature(listFeatureId);
  const queryParams = {};
  if (searchParam) queryParams[searchParam] = pickerState.search;
  if (pageParam) queryParams[pageParam] = pickerState.page;
  if (limitParam) queryParams[limitParam] = 10;
  const result = await callApi(feature, { queryParams });
  let list = unwrap(result.body);
  // In mock mode prefer the curated multi-item mock list over the endpoint's single canned
  // example — a picker showing only "yourself" as the one person to chat with is a worse demo
  // than an honestly-labeled richer mock list.
  if (!Array.isArray(list) || !list.length || (result.mock && mockItems)) list = mockItems || list || [];
  if (excludeSelf && STATE.session?.user) {
    const selfId = STATE.session.user._id || STATE.session.user.id;
    const selfEmail = STATE.session.user.email;
    list = list.filter(item => (item._id||item.id) !== selfId && item.email !== selfEmail);
  }
  const el = document.getElementById('picker-results');
  if (!el) return; // modal may have closed while awaiting
  el.innerHTML = (result.mock ? '<div style="padding:4px 6px"><span class="tag tag-mock">MOCK</span></div>' : '') +
    (list.length ? list.map(item => `<div class="picker-row" data-item='${JSON.stringify(item).replace(/'/g,"&#39;")}' onclick="pickerChooseFromEl(this)">${renderItem(item)}</div>`).join('')
                 : '<div class="empty-state">No results.</div>');
  const label = document.getElementById('picker-page-label');
  if (label) label.textContent = 'Page ' + pickerState.page;
}
function pickerChooseFromEl(el) {
  const item = JSON.parse(el.dataset.item);
  const cb = pickerState.onPick;
  pickerState = null;
  closeModal(); // always close before the callback runs, so a slow onPick can't leave the overlay blocking the page
  cb(item);
}

let notifCache = [];

  const result = await callApi(feature, { queryParams: { page: 1, limit: 10 } });
  const list = unwrap(result.body) || [];
  notifCache = Array.isArray(list) && list.length ? list : [
    { title: 'Welcome to BSTC1', message: 'This is a mock notification — connect a base URL to see real ones.', isDeleted: false },

function toggleNotifStream(on) { on ? startNotifStream() : stopNotifStream(); }
function startNotifStream() {
  if (notifEventSource || !STATE.baseUrl || !STATE.session?.user) return;
  const feature = findFeature('notif-stream');
  const userId = STATE.session.user._id || STATE.session.user.id || 'demo-user';
  const url = STATE.baseUrl.replace(/\/$/, '') + feature.path.replace('{userId}', encodeURIComponent(userId));
  try {
    notifEventSource = new EventSource(url);
    notifEventSource.onmessage = () => { refreshNotifBadge(); if (!document.getElementById('bell-panel').hidden) loadNotifications(); };
    notifEventSource.onerror = () => { stopNotifStream(); };
  } catch (e) { /* SSE not available (e.g. mock mode) */ }
}
function stopNotifStream() { if (notifEventSource) { notifEventSource.close(); notifEventSource = null; } }

async function openRoom(roomId, roomObj) {
  STATE.activeRoomId = roomId;
  document.querySelectorAll('.room-item').forEach(r => r.classList.toggle('active', r.dataset.room === roomId));
  const feature = findFeature('chat-get-messages');
  const result = await callApi(feature, { pathParams: { roomId }, queryParams: { page: 1, limit: 30 } });

  const list = Array.isArray(msgs) && msgs.length ? msgs.map(m => ({ content: m.content, mine: false })) : mockThread;

  await callApi(findFeature('chat-mark-all-read-if-last-read'), { pathParams: { roomId } });

  el.scrollTop = el.scrollHeight;

// ---------------- Assistant floating widget (message, stream, reload-context) ----------------
let assistantSessionId = null;
function openAssistant() { document.getElementById('assistant-modal').hidden = false; document.getElementById('assistant-input')?.focus(); }
function closeAssistant() { const m = document.getElementById('assistant-modal'); if (m) m.hidden = true; }
function assistantBubble(role, text, mock) {
  const log = document.getElementById('assistant-thread');
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (role === 'user' ? 'mine' : 'theirs');
  row.innerHTML = `<span class="avatar small">${role==='user' ? initials(STATE.session?.user?.name||'Me') : '🤖'}</span>
    <div class="bubble">${mock?'<span class="tag tag-mock" style="margin-bottom:4px;display:inline-block">MOCK</span><br>':''}<span class="bubble-text"></span></div>`;
  row.querySelector('.bubble-text').textContent = text;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}
async function sendAssistantMessage(evt) {
  evt.preventDefault();
  const input = document.getElementById('assistant-input');
  const text = input.value.trim();
  if (!text) return false;
  input.value = '';
  assistantBubble('user', text);
  const streaming = document.getElementById('assistant-stream-toggle')?.checked;
  const pending = assistantBubble('assistant', '…');
  const bodyParams = { message: text };
  if (assistantSessionId) bodyParams.sessionId = assistantSessionId;

  if (streaming && STATE.baseUrl) {
    const feature = findFeature('pa-stream');
    let path = feature.path + '?message=' + encodeURIComponent(text) + (assistantSessionId ? '&sessionId=' + encodeURIComponent(assistantSessionId) : '');
    const url = STATE.baseUrl.replace(/\/$/, '') + path;
    let full = '';
    try {
      const es = new EventSource(url);
      pending.querySelector('.bubble-text').textContent = '';
      es.onmessage = (e) => { full += e.data; pending.querySelector('.bubble-text').textContent = full; document.getElementById('assistant-thread').scrollTop = 9e9; };
      es.onerror = () => { es.close(); if (!full) pending.querySelector('.bubble-text').textContent = 'Mock reply to: "' + text + '"'; };
      return false;
    } catch (e) { /* fall through to normal POST */ }
  }

  const feature = findFeature('pa-message');
  const result = await callApi(feature, { body: bodyParams });
  const payload = result.body || {};
  const answer = payload.answer || (result.mock ? 'Mock reply to: "' + text + '"' : JSON.stringify(payload));
  if (payload.sessionId) assistantSessionId = payload.sessionId;
  pending.innerHTML = (result.mock?'<span class="tag tag-mock" style="margin-bottom:4px;display:inline-block">MOCK</span><br>':'') + escapeHtml(answer);
  return false;
}
async function handleReloadAssistantContext() {
  const result = await callApi(findFeature('pa-reload-context'));
  assistantBubble('assistant', (result.mock?'[MOCK] ':'') + 'Context reloaded.', result.mock);
}

// ---- Real Stripe Elements card collection (uses the real SetupIntent from payment-sheet) ----
let stripeJsPromise = null;
function loadStripeJs() {
  if (stripeJsPromise) return stripeJsPromise;
  stripeJsPromise = new Promise((resolve, reject) => {
    if (window.Stripe) return resolve(window.Stripe);
    const s = document.createElement('script');
    s.src = 'https://js.stripe.com/v3/';
    s.onload = () => window.Stripe ? resolve(window.Stripe) : reject(new Error('Stripe.js loaded but window.Stripe is missing.'));
    s.onerror = () => reject(new Error('Could not load Stripe.js from js.stripe.com — check your network/ad-blocker.'));
    document.head.appendChild(s);
  });
  return stripeJsPromise;
}
async function handleAddCard() {
  if (!STATE.baseUrl) {
    // Genuinely offline: nothing real to tokenize against, so fall back to a clearly-fake token
    // against the mock engine (same honesty rule as everywhere else — this only runs in mock mode).
    await callApi(findFeature('stripe-card-add'), { body: { paymentMethodId: 'pm_test_mock_' + Date.now() } });
    loadCards();
    return;
  }
  const sheetResult = await callApi(findFeature('stripe-sub-payment-sheet'));
  if (sheetResult.mock) {
    showModal(`<h3>Add a card</h3><p class="muted">Backend unreachable — falling back to a mock token.</p>`);
    await callApi(findFeature('stripe-card-add'), { body: { paymentMethodId: 'pm_test_mock_' + Date.now() } });
    closeModal(); loadCards();
    return;
  }
  if (sheetResult.error) {
    showModal(`<h3>Add a card</h3><div class="banner banner-error">${escapeHtml(sheetResult.body?.message || 'Failed to prepare card setup')}</div>`);
    return;
  }
  const sheet = unwrap(sheetResult.body) || {};
  if (!sheet.publishableKey) {
    showModal(`<h3>Add a card</h3><div class="banner banner-error">STRIPE_PUBLISHABLE_KEY is not configured on the backend (see .env) — real card collection needs it to load Stripe.js. Set it and try again.</div>`);
    return;
  }
  openStripeCardModal(sheet);
}
function openStripeCardModal(sheet) {
  showModal(`
    <h3>Add a card</h3>
    <p class="muted" style="font-size:12px">Real Stripe Elements — card details go straight to Stripe over HTTPS, this app and its backend never see the raw card number. Use Stripe's test card <code>4242 4242 4242 4242</code>, any future expiry, any CVC.</p>
    <div id="stripe-card-element" style="padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-inset);margin:14px 0;min-height:22px"><span class="loading">Loading Stripe…</span></div>
    <div id="stripe-card-error" class="banner banner-error" style="display:none"></div>
    <button class="btn-primary" id="stripe-card-submit" onclick="submitStripeCard('${escapeHtml(sheet.paymentIntent)}')" disabled>Save card</button>`);
  loadStripeJs().then(StripeCtor => {
    const stripe = StripeCtor(sheet.publishableKey);
    const elements = stripe.elements();
    const card = elements.create('card');
    document.getElementById('stripe-card-element').innerHTML = '';
    card.mount('#stripe-card-element');
    window.__stripeCardState = { stripe, card };
    const btn = document.getElementById('stripe-card-submit');
    if (btn) btn.disabled = false;
  }).catch(e => {
    const el = document.getElementById('stripe-card-element');
    if (el) el.innerHTML = `<p class="muted">${escapeHtml(e.message)}</p>`;
  });
}
async function submitStripeCard(clientSecret) {
  const btn = document.getElementById('stripe-card-submit');
  const errEl = document.getElementById('stripe-card-error');
  errEl.style.display = 'none';
  const st = window.__stripeCardState;
  if (!st) return;
  btn.disabled = true; btn.textContent = 'Saving…';
  const { setupIntent, error } = await st.stripe.confirmCardSetup(clientSecret, { payment_method: { card: st.card } });
  if (error) {
    btn.disabled = false; btn.textContent = 'Save card';
    errEl.style.display = ''; errEl.textContent = error.message;
    return;
  }

async function handleCheckoutPayment() {

async function handleFileChosen(file) {
  if (!file) return;
  const preview = document.getElementById('upload-preview');
  const isImage = file.type.startsWith('image/');
  const url = isImage ? URL.createObjectURL(file) : null;
  preview.innerHTML = `${url?`<img src="${url}" class="thumb">`:''}<span class="loading">Requesting signed upload URL…</span>`;
  const feature = findFeature('media-presign-upload');
  const presign = await callApi(feature, { body: { fileName: file.name, folderName: 'workspace', contentType: file.type || 'application/octet-stream' } });
  const data = unwrap(presign.body) || {};
  if (!presign.mock && data.url) {
    preview.innerHTML = `${url?`<img src="${url}" class="thumb">`:''}<span class="loading">Uploading to S3…</span>`;
    try { await fetch(data.url, { method: 'PUT', body: file, headers: { 'Content-Type': file.type } }); } catch (e) {}
  }
  preview.innerHTML = `${url?`<img src="${url}" class="thumb">`:''}<span class="upload-success">✓ ${presign.mock?'<span class="tag tag-mock">MOCK</span> ':''}Upload flow complete — key: ${escapeHtml(data.key || file.name)}</span>`;
  uploadHistory.unshift({ fileName: file.name, key: data.key || file.name, mock: presign.mock });
  renderUploadHistory();
}
function renderUploadHistory() {
  const el = document.getElementById('upload-history');
  if (!el) return;
  if (!uploadHistory.length) { el.innerHTML = '<div class="empty-state">Nothing uploaded yet.</div>'; return; }
  el.innerHTML = uploadHistory.map(u => `
    <div class="card-row"><span>${u.mock?'<span class="tag tag-mock">MOCK</span> ':''}${escapeHtml(u.fileName)}</span>
      <span><button class="btn-ghost" onclick="handleGetDownloadLink('${escapeHtml(u.key)}')">Get link</button>
      <button class="btn-danger" onclick="handleDeleteMedia('${escapeHtml(u.key)}')">Delete</button></span></div>`).join('');
}
async function handleGetDownloadLink(fileName) {
  const result = await callApi(findFeature('media-presign-download'), { body: { fileName, folderName: 'workspace' } });

async function handleDeleteMedia(fileName) {
  await callApi(findFeature('media-delete'), { body: { fileName, folderName: 'workspace' } });
  uploadHistory = uploadHistory.filter(u => u.key !== fileName);
  renderUploadHistory();
}

function renderModuleWorkspace(mod) {
  return `<div class="screen wide">
    <h1>${escapeHtml(mod.module)}</h1>
    <p class="muted">${mod.features.length} endpoint${mod.features.length!==1?'s':''} in this module.</p>
    <div class="workspace-grid">${mod.features.map(f => renderWorkspaceCard(f)).join('')}</div>
  </div>`;
}
function renderWorkspaceCard(f) {
  const bodyFields = f.request_body ? renderGenericFields('ws-' + f.id, f.request_body) : '';
  const paramFields = (f.path_params||[]).map(p => `<label>${escapeHtml(p.name)}</label><input id="ws-param-${f.id}-${p.name}" class="mono" placeholder="${escapeHtml(p.example||p.name)}">`).join('');
  return `<div class="card">
    <span class="method-badge method-${f.method.toLowerCase()}">${f.method}</span> <strong>${escapeHtml(f.name)}</strong>
    <p class="muted">${escapeHtml(f.description)}</p>
    <form onsubmit="return submitWorkspaceCard(event, '${f.id}')">
      ${paramFields}${bodyFields}
      <button class="btn-primary" type="submit">${escapeHtml(f.method === 'GET' ? 'Fetch' : f.name)}</button>
    </form>
    <div id="ws-result-${f.id}" class="workspace-result"></div>
  </div>`;
}
async function submitWorkspaceCard(evt, id) {
  evt.preventDefault();
  const f = findFeature(id);
  const pathParams = {}; (f.path_params||[]).forEach(p => { pathParams[p.name] = document.getElementById(`ws-param-${id}-${p.name}`)?.value || ''; });
  const body = f.request_body ? collectGenericFields('ws-' + id, f.request_body) : undefined;
  const resultEl = document.getElementById(`ws-result-${id}`);
  resultEl.innerHTML = '<div class="loading">Calling…</div>';
  const result = await callApi(f, { pathParams, body });
  const tag = result.mock ? '<span class="tag tag-mock">MOCK</span>' : '<span class="tag tag-live">LIVE</span>';
  const data = unwrap(result.body);
  resultEl.innerHTML = tag + ' <span class="status-badge status-2xx">' + result.status + '</span>' +
    (Array.isArray(data) ? renderTable(data, Object.keys(data[0]||{}).map(k=>({key:k,label:k}))) : `<pre class="json-view">${escapeHtml(JSON.stringify(data,null,2))}</pre>`);
  return false;
}
function renderTable(rows, columns) {
  if (!rows.length) return '<div class="empty-state">Nothing here yet.</div>';
  const head = columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
  const body = rows.map(r => `<tr>${columns.map(c => `<td>${escapeHtml(typeof r[c.key]==='object'&&r[c.key]!==null?JSON.stringify(r[c.key]):r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

SCREEN_RENDERERS.explorer = () => `

SCREEN_AFTER_RENDER.explorer = () => {

  else document.getElementById('explorer-detail').innerHTML = `<div class="screen"><p class="muted">Raw request/response access to every endpoint — useful for edge cases and debugging. Every endpoint here also has a real screen elsewhere in the app.</p></div>`;

function buildExplorerNav() {
  document.getElementById('explorer-nav-scroll').innerHTML = MODULES.map(mod => `
    <div class="nav-group">
      <button class="nav-group-title" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'':'none'">${escapeHtml(mod.module)} (${mod.features.length})</button>
      <ul>${mod.features.map(f => `<li><a href="#" class="expl-link" data-id="${f.id}" data-search="${escapeHtml((f.name+' '+f.method+' '+f.path).toLowerCase())}" onclick="selectExplorerFeature('${f.id}');return false;">
        <span class="method-badge method-${f.method.toLowerCase()}">${f.method}</span><span>${escapeHtml(f.name)}</span></a></li>`).join('')}</ul>
    </div>`).join('');
}
function filterExplorerNav(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.expl-link').forEach(a => { a.style.display = !q || a.dataset.search.includes(q) ? '' : 'none'; });
  document.querySelectorAll('.explorer-nav .nav-group').forEach(g => {
    g.style.display = Array.from(g.querySelectorAll('.expl-link')).some(a => a.style.display !== 'none') ? '' : 'none';
  });
}
function selectExplorerFeature(id) {
  STATE.explorerFeatureId = id;
  STATE.explorerTab = 'docs';
  document.querySelectorAll('.expl-link').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  const f = findFeature(id);
  const root = document.getElementById('explorer-detail');
  root.innerHTML = `
    <span class="method-badge method-${f.method.toLowerCase()}">${f.method}</span> <strong>${escapeHtml(f.name)}</strong>
    <span class="muted" style="margin-left:8px;font-size:11.5px">also available at: <strong>${escapeHtml(NAV_ITEMS.find(n=>n.id===f.screen)?.label || f.screen)}</strong></span>
    <div class="mono" style="margin:6px 0 2px">${escapeHtml(f.path)}</div>
    <p class="muted">${escapeHtml(f.description)}</p>
    <div class="tabs">
      <button data-tab="docs" onclick="setExplorerTab('docs')">Docs</button>
      <button data-tab="request" onclick="setExplorerTab('request')">Request</button>
      <button data-tab="try" onclick="setExplorerTab('try')">Try it</button>
      <button data-tab="response" onclick="setExplorerTab('response')">Response</button>
    </div>
    <div class="tab-panel" data-tab="docs">${explorerDocsTab(f)}</div>
    <div class="tab-panel" data-tab="request">${explorerRequestTab(f)}</div>
    <div class="tab-panel" data-tab="try">
      <button class="btn-primary" onclick="explorerTryIt('${f.id}')">Try it — ${f.method} ${escapeHtml(f.path)}</button>
      <p class="muted" style="margin-top:8px">Result appears here and on the Response tab.</p>
      <div id="explorer-try-result"></div>
    </div>
    <div class="tab-panel" data-tab="response"><div id="explorer-response-result"><p class="muted">Nothing yet.</p></div></div>
  `;
  setExplorerTab('docs');
}
function setExplorerTab(tab) {
  STATE.explorerTab = tab;
  document.querySelectorAll('.explorer-detail .tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.explorer-detail .tab-panel').forEach(p => p.hidden = p.dataset.tab !== tab);
}
function explorerDocsTab(f) {
  let html = `<table class="info-table"><tr><th>Auth required</th><td>${f.auth_required?'Yes — Bearer token':'No'}</td></tr></table>`;
  if (f.headers?.length) html += `<h4>Headers</h4><table class="info-table">${f.headers.map(h=>`<tr><th>${escapeHtml(h.name)}</th><td class="mono">${escapeHtml(h.value)}</td></tr>`).join('')}</table>`;
  if (f.path_params?.length) html += `<h4>Path params</h4><table class="info-table">${f.path_params.map(p=>`<tr><th>${escapeHtml(p.name)}</th><td>${escapeHtml(p.description||'')}</td></tr>`).join('')}</table>`;
  if (f.query_params?.length) html += `<h4>Query params</h4><table class="info-table">${f.query_params.map(q=>`<tr><th>${escapeHtml(q.name)}${q.required?' *':''}</th><td>${escapeHtml(q.description||'')}</td></tr>`).join('')}</table>`;
  if (f.response_errors?.length) { html += `<h4>Documented errors</h4>`; f.response_errors.forEach(e => html += `<div class="error-block"><span class="status-badge status-4xx">${e.status}</span><pre class="json-view">${escapeHtml(JSON.stringify(e.body,null,2))}</pre></div>`); }
  if (f.notes) html += `<div class="notes-box">${escapeHtml(f.notes)}</div>`;
  return html;
}
function explorerRequestTab(f) {
  let html = '';
  if (f.path_params?.length) { html += '<h4>Path params</h4>'; f.path_params.forEach(p => html += `<label>${escapeHtml(p.name)}</label><input id="expl-param-${f.id}-${p.name}" class="mono" value="${escapeHtml(p.example||'')}">`); }
  if (f.query_params?.length) { html += '<h4>Query params</h4>'; f.query_params.forEach(q => html += `<label>${escapeHtml(q.name)}</label><input id="expl-query-${f.id}-${q.name}" class="mono">`); }
  if (f.request_body !== null && f.request_body !== undefined) {
    html += `<h4>Body</h4><textarea id="expl-body-${f.id}" class="mono" oninput="validateExplorerJson('${f.id}')">${escapeHtml(JSON.stringify(f.request_body, null, 2))}</textarea><div class="editor-error" id="expl-body-error-${f.id}" hidden></div>`;
  } else { html += '<p class="muted">This endpoint takes no request body.</p>'; }
  return html;
}
function validateExplorerJson(id) {
  const ta = document.getElementById('expl-body-' + id), err = document.getElementById('expl-body-error-' + id);
  if (!ta) return true;
  try { JSON.parse(ta.value || '{}'); err.hidden = true; return true; } catch (e) { err.hidden = false; err.textContent = 'Invalid JSON: ' + e.message; return false; }
}
async function explorerTryIt(id) {
  const f = findFeature(id);
  if (f.request_body !== null && f.request_body !== undefined && !validateExplorerJson(id)) { setExplorerTab('request'); return; }
  setExplorerTab('response');
  const target1 = document.getElementById('explorer-try-result'), target2 = document.getElementById('explorer-response-result');
  target2.innerHTML = '<div class="loading">Calling endpoint…</div>';
  const pathParams = {}; (f.path_params||[]).forEach(p => { const el = document.getElementById(`expl-param-${id}-${p.name}`); pathParams[p.name] = el?.value || p.example || `{${p.name}}`; });
  const queryParams = {}; (f.query_params||[]).forEach(q => { const el = document.getElementById(`expl-query-${id}-${q.name}`); if (el?.value) queryParams[q.name] = el.value; });
  let body; if (f.request_body !== null && f.request_body !== undefined) { const ta = document.getElementById(`expl-body-${id}`); try { body = JSON.parse(ta.value || '{}'); } catch { body = undefined; } }
  const result = await callApi(f, { pathParams, queryParams, body });
  const tag = result.mock ? `<span class="tag tag-mock">MOCK${result.mockReason?' — '+escapeHtml(result.mockReason):''}</span>` : '<span class="tag tag-live">LIVE</span>';
  const sClass = result.status >= 500 ? 'status-5xx' : result.status >= 400 ? 'status-4xx' : 'status-2xx';
  let bodyHtml;
  if (f.response_kind === 'list' && Array.isArray(result.body)) bodyHtml = explorerTable(result.body);
  else bodyHtml = `<pre class="json-view">${escapeHtml(typeof result.body === 'string' ? result.body : JSON.stringify(result.body, null, 2))}</pre>`;
  const full = `<div class="result-header">${tag} <span class="status-badge ${sClass}">${result.status||'—'}</span></div>${bodyHtml}`;
  target1.innerHTML = full; target2.innerHTML = full;
}
function explorerTable(rows) {
  if (!rows.length) return '<div class="empty-state">No rows returned.</div>';
  const cols = Object.keys(rows[0]);
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(typeof r[c]==='object'&&r[c]!==null?JSON.stringify(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
